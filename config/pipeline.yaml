# Orboh OpenArm one-shot manipulation pipeline.
# Secrets (API keys, web token) live in .env, not here.
# Lines marked VERIFY must be checked against the Orboh LeRobot fork / real hardware.

robot:
  # sim     -> MuJoCo-backed fake robot (develop the whole pipeline on a laptop)
  # bridge  -> real arms through scripts/robot_bridge.py, a separate process in the LeRobot venv (recommended)
  # lerobot -> in-process LeRobot fork; only works if this venv can import lerobot + openarm_can
  backend: sim
  control_hz: 30
  lerobot:
    robot_type: bi_openarm_follower        # name registered in the fork (checked 2026-10-20)
    robot_kwargs: {}                       # only for backend: lerobot; the fork wants left_arm_config/right_arm_config
    # Observation / action keys of the fork, e.g. left_joint_1.pos, right_gripper.pos. {side} = left|right
    joint_key: "{side}_joint_{index}.pos"
    gripper_key: "{side}_gripper.pos"
    joint_units: degrees                   # the fork speaks degrees
    # canonical_rad = sign * robot_value + offset   (per joint, defaults 1 / 0)
    joint_signs: {}
    joint_offsets: {}
    gripper_closed: 0.0                    # degrees; fork limits are (-65, 0)
    gripper_open: -65.0                    # VERIFY on the real gripper before trusting the open direction
  bridge:
    endpoint: tcp://127.0.0.1:5560         # scripts/robot_bridge.py --endpoint
    timeout_ms: 2000

cameras:
  expected_roles: [center, right_wrist, left_wrist]
  width: 640
  height: 480
  fps: 30
  # Pin serial numbers once known; discovery is then skipped.
  # Serials from the Kitakyushu setup (openarm-orboh bimanual-collect.takeei_wood_l1.env, matches lsusb 2026-10-20).
  pinned_serials: {center: "344422070898", right_wrist: "352122273417", left_wrist: "409122272149"}
  discovery:
    # auto: pinned -> model heuristic (D405 = wrist) -> wiggle-test (if allowed)
    # Opening/closing the right gripper fills much of the wrist view but is tiny in
    # the center view, and needs no arm motion. Any joint name works here.
    motion_joint: right_gripper
    motion_amplitude: 0.6                  # gripper: normalized 0..1; arm joint: radians
  output: config/cameras.yaml

dreamlab:
  backend: mock                            # mock (replays demo) | http (real API)
  timeout_s: 120
  plan_endpoint: /plan                     # VERIFY once API docs are in
  health_endpoint: /health                 # VERIFY
  send_images: true

# Closed-loop Dream-1 policy (work/14-policy.md): frames + joints + prompt in, action chunks out.
policy:
  backend: mock                            # mock (offline sway) | dream (real API, needs DREAMLAB_API_KEY)
  checkpoint: dreamlabs/dream-1-beta-flash # or dreamlabs/dream-1-beta
  prompt: "pick up the object"
  ik_arm: openarm2_faas                    # client-side IK for the base model's end-effector answer
  action_hz: 20
  execution_horizon: 30
  max_duration_s: 30
  # Dream camera slot -> Orboh camera role (real robot). Unmapped slots get a black frame.
  camera_map: {overhead: center, wrist_l: left_wrist, wrist_r: right_wrist}
  sim_cameras: {overhead: tablecam, wrist_l: camera_wrist_left, wrist_r: camera_wrist_right}

demos:
  dataset_root: data/demos                 # LeRobot Dataset v3.0 directory

recording:
  # Teleop recording is delegated to the team's existing script. {mode} = dry | run
  command: "bash ~/projects/openarm-orboh/scripts/collect_bimanual.sh {mode}"  # VERIFY path

sim:
  engine: mujoco
  # Path to an MJCF file, or a path inside the openarm-mujoco package.
  scene: pedestal/move_puck_scene.xml

safety:
  joint_limit_margin_rad: 0.05
  max_joint_velocity_rad_s: 1.2
  max_joint_accel_rad_s2: 8.0
  max_gripper_velocity: 3.0                # normalized gripper units (0..1) per second
  approach_speed_rad_s: 0.3                # speed of the move from current pose to plan start
  max_plan_duration_s: 120
  sim_max_tracking_error_rad: 0.25
  runtime_max_tracking_error_rad: 0.35
  max_state_drift_rad: 0.05                # robot moved since the sim check -> re-check
  watchdog_s: 0.25                         # control-loop iteration budget before abort
  allow_finger_env_contact: true
  require_sim_pass: true
  require_manual_approval: true

web:
  host: 0.0.0.0
  port: 8000

runs_dir: runs
